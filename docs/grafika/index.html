<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Grafika ke sdílení – Zelené Brno</title>
<link href="../wp-content/themes/zeleni-new/assets/img/favicon.png" rel="icon" type="image/png">
<style>
  :root { --green:#0BD26F; --forest:#0F4E2F; --ink:#111; --muted:#666; --line:#e3e3e3; --soft:#f5f6f5; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; color: var(--ink); background: #fff; }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 24px 16px 60px; }
  h1 { font-size: 26px; margin: 0 0 4px; }
  .lead { color: var(--muted); margin: 0 0 28px; }
  .deck { border-top: 2px solid var(--forest); padding: 18px 0 30px; }
  .deck h2 { font-size: 20px; margin: 0; }
  .meta { color: var(--muted); font-size: 14px; margin: 2px 0 12px; }
  .strip { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 8px; scroll-snap-type: x mandatory; }
  .strip a { flex: 0 0 auto; scroll-snap-align: start; position: relative; }
  .strip img { display: block; height: 260px; width: auto; border-radius: 4px; border: 1px solid var(--line); background: var(--soft); }
  .strip span { position: absolute; left: 6px; top: 6px; background: rgba(0,0,0,.6); color: #fff; font-size: 12px; font-weight: 700; padding: 1px 6px; border-radius: 3px; }
  .dl { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 12px; }
  .btn { display: inline-block; background: var(--green); color: #000; font-weight: 700; text-decoration: none; padding: 9px 16px; border-radius: 6px; }
  .btn:hover { filter: brightness(.95); }
  .one { display: inline-block; min-width: 34px; text-align: center; padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; color: var(--ink); text-decoration: none; font-size: 14px; font-weight: 600; }
  .one:hover { border-color: var(--forest); }
  .dl small { color: var(--muted); margin-right: 2px; }
  details { margin-top: 12px; }
  summary { cursor: pointer; font-weight: 600; font-size: 14px; }
  pre { white-space: pre-wrap; background: var(--soft); padding: 12px; border-radius: 6px; font: inherit; margin: 8px 0; }
  .copy { font: inherit; font-size: 14px; padding: 6px 12px; border: 1px solid var(--line); background: #fff; border-radius: 6px; cursor: pointer; }
  .empty, .err { color: var(--muted); }
  @media (max-width: 600px) { .strip img { height: 200px; } }
</style>
</head>
<body>
<div class="wrap">
  <h1>Grafika ke sdílení</h1>
  <p class="lead">Carousely Zeleného Brna ke stažení – jednotlivé obrázky nebo všechny najednou jako ZIP. Kliknutím na náhled otevřete obrázek v plné velikosti.</p>
  <div id="list"><p class="empty">Načítám…</p></div>
</div>
<script>
(async () => {
  const list = document.getElementById('list');
  const el = (tag, attrs = {}, ...kids) => {
    const e = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
    for (const k of kids) if (k != null) e.append(k);
    return e;
  };
  const pad = n => String(n).padStart(2, '0');
  const datum = iso => { const [y, m, d] = iso.split('-'); return `${+d}. ${+m}. ${y}`; };
  let decks;
  try {
    const r = await fetch('carousely.json', { cache: 'no-cache' });
    decks = await r.json();
  } catch (e) {
    list.replaceChildren(el('p', { class: 'err' }, 'Seznam carouselů se nepodařilo načíst.'));
    return;
  }
  if (!decks.length) { list.replaceChildren(el('p', { class: 'empty' }, 'Zatím tu nic není.')); return; }
  list.replaceChildren(...decks.map(d => {
    const strip = el('div', { class: 'strip' });
    const dl = el('div', { class: 'dl' },
      el('a', { class: 'btn', href: `${d.name}/${d.name}.zip`, download: `${d.name}.zip` },
        `Stáhnout vše (ZIP, ${(d.zipBytes / 1e6).toFixed(1).replace('.', ',')} MB)`),
      el('small', {}, 'Jednotlivě:'));
    for (let i = 1; i <= d.slides; i++) {
      const png = `${d.name}/slide-${pad(i)}.png`;
      strip.append(el('a', { href: png, target: '_blank', rel: 'noopener', title: `Snímek ${i}` },
        el('img', { src: `${d.name}/thumb-${pad(i)}.jpg`, alt: `${d.title} – snímek ${i}`, loading: 'lazy' }),
        el('span', {}, String(i))));
      dl.append(el('a', { class: 'one', href: png, download: `${d.name}-${pad(i)}.png` }, String(i)));
    }
    const sec = el('section', { class: 'deck', id: d.name },
      el('h2', {}, d.title),
      el('p', { class: 'meta' }, `${datum(d.date)} · ${d.slides} snímků · ${d.format} px`),
      strip, dl);
    if (d.caption) {
      const pre = el('pre', {}, d.caption);
      const btn = el('button', { class: 'copy', type: 'button' }, 'Kopírovat text');
      btn.addEventListener('click', async () => {
        try { await navigator.clipboard.writeText(d.caption); btn.textContent = 'Zkopírováno ✓'; }
        catch (e) { btn.textContent = 'Označte text a zkopírujte ručně'; }
      });
      sec.append(el('details', {}, el('summary', {}, 'Text příspěvku'), pre, btn));
    }
    return sec;
  }));
})();
</script>
</body>
</html>
